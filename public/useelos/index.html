<style>
  :root { --bg:#0F1A14; --surface:#162218; --accent:#B69A65; --text:#E8DCC8; --muted:#9B8B78; --border:#2A3D2E; --wa:#25D366; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #17291d 0%, var(--bg) 60%);
    color: var(--text); font-family: 'Outfit', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 20px; -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .mark { width: 150px; height: auto; margin: 0 auto 14px; display: block; }
  .brand { font-size: 11.5px; letter-spacing: .32em; text-transform: uppercase; color: var(--accent); margin: 0 0 40px; padding-left: .32em; }
  .tag { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 0 0 20px; font-size: 13px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: var(--text); }
  .tag::before, .tag::after { content: ""; width: 28px; height: 1px; background: var(--accent); opacity: .7; }
  h1 { font-size: 28px; line-height: 1.2; font-weight: 500; margin: 0 0 14px; text-wrap: balance; }
  p.lead { color: var(--muted); font-size: 16px; line-height: 1.55; margin: 0 0 32px; text-wrap: balance; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--wa); color: #06210f; text-decoration: none; font-weight: 600; font-size: 17px;
    padding: 16px 20px; border-radius: 14px; box-shadow: 0 8px 28px rgba(37,211,102,.22);
  }
  .btn svg { width: 22px; height: 22px; fill: currentColor; }
  .btn:active { transform: translateY(1px); }
  .note { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .rule { height: 1px; background: var(--border); margin: 34px auto 0; width: 60px; }
</style>
</head>
<body>
<main>
  <img class="mark" src="/wordmark-brass.svg" alt="elos" />
  <p class="brand">Relacionamento estratégico</p>
